      - { titulo: Patrimonio vivo, texto: "Restos romanos, barrios marineros y fiestas: cuidarlos y que sigan siendo de la gente." }
      - { titulo: Puertos abiertos, texto: "Muelles, paseos y naves que vuelven a ser ciudad." }
