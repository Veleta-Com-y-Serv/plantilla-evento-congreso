  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Antes de venir
    preguntas:
      - { pregunta: "¿Puedo cambiar el nombre de mi entrada?", respuesta: "Sí, hasta una semana antes de las jornadas. Escríbenos con el nombre nuevo y te enviamos la acreditación." }
      - { pregunta: "¿Hay que apuntarse a los talleres?", respuesta: "Sí. Los talleres tienen plazas limitadas y se eligen al inscribirte con el abono completo. Si quedan plazas, se pueden reservar en el vestíbulo." }
      - { pregunta: "¿Dais certificado de asistencia?", respuesta: "Sí, con las horas de cada sesión. Lo enviamos por correo la semana siguiente a las jornadas." }
      - { pregunta: "¿Las sesiones se graban?", respuesta: "Las ponencias de la sala grande se graban y se publican después. Las mesas redondas y los talleres, no." }
      - { pregunta: "¿Es accesible la nave?", respuesta: "Sí. Todo está en planta baja, con aseos adaptados y bucle magnético en la sala grande. Si necesitas algo más, dínoslo al inscribirte." }
      - { pregunta: "¿Puedo proponer una ponencia para la próxima edición?", respuesta: "Claro. Abrimos la convocatoria en otoño; mientras, escríbenos desde el formulario con tu propuesta." }

  cta:
    activa: true
    antetitulo: Plazas limitadas
