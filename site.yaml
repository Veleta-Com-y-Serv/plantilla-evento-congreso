      - { titulo: "18", texto: "talleres y visitas guiadas" }

  sobre:
    activa: true
    antetitulo: Las jornadas
    titulo: Un punto de encuentro entre quien gestiona, quien visita y quien vive la costa
    texto: "Litoral nació en 2024 en una nave del puerto con cien personas y una pregunta: ¿cómo seguimos recibiendo visitantes sin perder la ciudad?\n\nCuatro ediciones después reunimos a técnicos de turismo, hosteleros, arquitectas, pescadores, investigadores y vecinos. Sin discursos largos: experiencias que funcionan, datos claros y tiempo para hablar entre sesiones."
    imagen: /fotos/sobre.jpg
    items:
      - { titulo: Turismo que deja algo, texto: "Modelos que reparten el gasto del visitante por los barrios y el comercio local." }
      - { titulo: Patrimonio vivo, texto: "Restos romanos, barrios marineros y fiestas: cuidarlos y que sigan siendo de la gente." }
      - { titulo: Puertos abiertos, texto: "Muelles, paseos y naves que vuelven a ser ciudad." }
      - { titulo: Mesa y producto, texto: "Lonja, huerta y bodegas del territorio como motor del viaje." }
    cta: { texto: Consulta el programa, url: "/#programa" }

  programa:
    activa: true
    antetitulo: Programa
    titulo: Tres días, una agenda
    texto: "Las sesiones de la mañana son en la sala grande; las de la tarde, en las salas de taller. Programa sujeto a pequeños cambios."
    programa:
      - { dia: "Jueves 15", hora: "9:30", titulo: Acreditaciones y café de bienvenida, texto: "", ponente: "", sala: Vestíbulo, categoria: Pausa }
      - { dia: "Jueves 15", hora: "10:15", titulo: Inauguración de las jornadas, texto: "Presentación de la cuarta edición y de los grupos de trabajo.", ponente: Organización de Litoral, sala: Sala Mar, categoria: Ponencia }
      - { dia: "Jueves 15", hora: "11:00", titulo: "El visitante que se queda: estancias largas en ciudades medianas", texto: "Qué hace que alguien alargue el viaje y qué gana la ciudad cuando lo hace.", ponente: Clara Vives Roig, sala: Sala Mar, categoria: Ponencia }
      - { dia: "Jueves 15", hora: "12:30", titulo: "Mesa redonda: barrios marineros, vecinos y alquiler turístico", texto: "Tres municipios de la costa cuentan qué han probado y qué no ha funcionado.", ponente: "Jordi Ferrer, Marta Llorens y Ana Bosch", sala: Sala Mar, categoria: Mesa redonda }
      - { dia: "Jueves 15", hora: "16:00", titulo: "Taller: cómo medir la huella de un evento", texto: "Una hoja de cálculo sencilla para saber cuánto consume y cuánto deja tu evento.", ponente: Pau Castells, sala: Sala Taller 1, categoria: Taller }
      - { dia: "Jueves 15", hora: "18:30", titulo: Paseo guiado por la Part Alta al atardecer, texto: "Salida desde la puerta de la nave. Plazas limitadas.", ponente: Núria Domènech, sala: Salida en el vestíbulo, categoria: Visita }
      - { dia: "Viernes 16", hora: "9:30", titulo: "Patrimonio romano y vida cotidiana: convivir con un museo al aire libre", texto: "Cómo se cuida un patrimonio que está en mitad de las calles, las tiendas y las casas.", ponente: Elena Puig Marsal, sala: Sala Mar, categoria: Ponencia }
      - { dia: "Viernes 16", hora: "11:00", titulo: "Puertos que vuelven a la ciudad", texto: "Naves, tinglados y muelles reconvertidos en paseo, mercado y sala de cultura.", ponente: Iñaki Arrieta, sala: Sala Mar, categoria: Ponencia }
      - { dia: "Viernes 16", hora: "12:00", titulo: Pausa y degustación de producto de la lonja, texto: "", ponente: "", sala: Terraza del muelle, categoria: Pausa }
      - { dia: "Viernes 16", hora: "12:45", titulo: "Mesa redonda: de la barca al plato", texto: "Cofradías, cocineros y mercados hablan de precio justo y de temporada.", ponente: "Rosa Mestres, Toni Sabaté y Laia Fort", sala: Sala Mar, categoria: Mesa redonda }
      - { dia: "Viernes 16", hora: "16:30", titulo: "Taller: rutas a pie que reparten visitantes", texto: "Diseñamos en grupos una ruta por barrios poco visitados.", ponente: Núria Domènech, sala: Sala Taller 2, categoria: Taller }
      - { dia: "Viernes 16", hora: "21:00", titulo: Cena de las jornadas en el Serrallo, texto: "Con reserva previa al inscribirte.", ponente: "", sala: Barrio del Serrallo, categoria: Visita }
      - { dia: "Sábado 17", hora: "10:00", titulo: "Moverse sin coche por la costa", texto: "Tren, bicicleta y lanzadera: lo que funciona en verano y en invierno.", ponente: David Soler Ribas, sala: Sala Mar, categoria: Ponencia }
      - { dia: "Sábado 17", hora: "11:30", titulo: Presentación de los grupos de trabajo, texto: "Conclusiones de los talleres y propuestas para el próximo año.", ponente: Grupos de trabajo, sala: Sala Mar, categoria: Mesa redonda }
      - { dia: "Sábado 17", hora: "13:00", titulo: Clausura y vermut en el muelle, texto: "", ponente: "", sala: Terraza del muelle, categoria: Pausa }
    cta: { texto: Reserva tu plaza, url: "/#entradas" }

