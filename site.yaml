    antetitulo: Las jornadas
    titulo: Un punto de encuentro entre quien gestiona, quien visita y quien vive la costa
    texto: "Litoral nació en 2024 en una nave del puerto con cien personas y una pregunta: ¿cómo seguimos recibiendo visitantes sin perder la ciudad?\n\nCuatro ediciones después reunimos a técnicos de turismo, hosteleros, arquitectas, pescadores, investigadores y vecinos. Sin discursos largos: experiencias que funcionan, datos claros y tiempo para hablar entre sesiones."
    imagen: /fotos/sobre.jpg
    items:
